<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 游戏厅 · Alchemist's Lab</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="games-page">
  <!-- 粒子背景 -->
  <canvas id="particles"></canvas>

  <!-- 导航（与首页一致） -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><Alchemist /></a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="games.html" class="active">🎮 游戏厅</a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Games Hero -->
  <section class="games-hero">
    <div class="container">
      <div class="games-hero-content">
        <div class="hero-badge">🎮 开发者的游乐场</div>
        <h1 class="games-hero-title">
          <span class="line">像素之间</span>
          <span class="line accent">皆是乐趣</span>
        </h1>
        <p class="games-hero-desc">
          把每一个小游戏当作一次技术实验 ——<br>
          用代码创造快乐，用玩法诠释创意。
        </p>
        <div class="games-hero-stats">
          <div class="stat-item">
            <span class="stat-num" data-target="9">0</span>
            <span class="stat-label">小游戏</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num">+∞</span>
            <span class="stat-label">快乐值</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num" data-target="6">0</span>
            <span class="stat-label">种玩法</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 游戏分类筛选 -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="game-filters" id="gameFilters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="action">动作</button>
        <button class="filter-btn" data-filter="puzzle">益智</button>
        <button class="filter-btn" data-filter="arcade">街机</button>
        <button class="filter-btn" data-filter="strategy">策略</button>
      </div>
    </div>
  </section>

  <!-- 游戏列表 -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="games-grid" id="gamesGrid">
        <!-- 由 JS 动态渲染 -->
      </div>
    </div>
  </section>

  <!-- 返回首页 -->
  <div class="back-home" style="text-align: center; padding: 0 0 80px;">
    <a href="index.html" class="btn secondary">← 返回博客首页</a>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-text">
        <span class="footer-cmd">$ echo "Every game is a tiny universe."</span><br>
        <span class="footer-out">→ © 2026 Alchemist's Lab. More games coming soon.</span>
      </p>
    </div>
  </footer>

  <script src="games.js"></script>
  <script src="script.js"></script>
  <script src="version.js"></script>
</body>
</html>
